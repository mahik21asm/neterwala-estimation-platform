<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neterwala Group Product Estimation Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@300;400;700&family=Architects+Daughter&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===== UDL Product Costing — wireframe style sheet =====
   Sketchy / low-fi vibe per Wireframe skill: handwritten readable type,
   mostly b&w with restrained Excel-style accent colors (green/blue/yellow). */

@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@300;400;700&family=Architects+Daughter&family=JetBrains+Mono:wght@400;600&display=swap');

:root {
  --ink: #1a1a1a;
  --ink-soft: #4a4a4a;
  --ink-faint: #8a8a8a;
  --paper: #fafaf6;
  --paper-2: #f3f1e8;
  --rule: #2a2a2a;

  /* Excel-faithful accents */
  --xl-green: #c8e6c9;     /* linked from Sales Entry */
  --xl-green-ink: #1b5e20;
  --xl-blue: #bbdefb;      /* formula / computed */
  --xl-blue-ink: #0d47a1;
  --xl-yellow: #fff59d;    /* user-editable input */
  --xl-yellow-ink: #6f5b00;
  --xl-white: #ffffff;     /* labels */

  --accent: #d97757;       /* warm UDL accent */
  --warn: #c62828;
  --ok: #2e7d32;

  --font-hand: 'Kalam', 'Architects Daughter', cursive;
  --font-hand-bold: 'Caveat', cursive;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-hand);
  font-weight: 400;
  color: var(--ink);
  background:
    repeating-linear-gradient(0deg, transparent 0 31px, rgba(0,0,0,0.04) 31px 32px),
    var(--paper);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.45;
}

/* ============ APP SHELL ============ */
.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  grid-template-rows: 64px 1fr;
  min-height: 100vh;
}
.topbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 0 24px;
  border-bottom: 2px solid var(--rule);
  background: var(--paper);
  position: sticky; top: 0; z-index: 50;
}
.brand {
  font-family: var(--font-hand-bold);
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 0.5px;
  display: flex; align-items: center; gap: 10px;
}
.brand .logo {
  width: 38px; height: 38px;
  border: 2.5px solid var(--ink);
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 18px;
  background: var(--paper-2);
  transform: rotate(-3deg);
}
.brand .sub {
  font-family: var(--font-hand);
  font-size: 13px;
  color: var(--ink-soft);
  margin-left: 4px;
  font-weight: 400;
}
.topbar-spacer { flex: 1; }

.context-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 14px;
  border: 1.5px dashed var(--ink);
  border-radius: 18px;
  background: var(--paper-2);
  font-size: 14px;
}
.context-pill b { font-family: var(--font-hand-bold); font-weight: 700; font-size: 17px; }

.user-chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 10px 4px 4px;
  border: 1.5px solid var(--ink);
  border-radius: 999px;
}
.user-chip .av {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--xl-yellow);
  display: grid; place-items: center;
  font-family: var(--font-hand-bold);
  font-weight: 700;
  border: 1.5px solid var(--ink);
}

.sidebar {
  border-right: 2px solid var(--rule);
  padding: 18px 14px;
  background: var(--paper);
}
.nav-group { margin-bottom: 18px; }
.nav-label {
  font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--ink-faint); padding: 0 8px 6px;
  font-family: var(--font-mono); font-weight: 600;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
  color: var(--ink);
  border: 1.5px solid transparent;
}
.nav-item:hover { background: var(--paper-2); }
.nav-item.active {
  background: var(--paper-2);
  border-color: var(--ink);
  border-style: dashed;
  font-weight: 700;
  font-family: var(--font-hand-bold);
  font-size: 18px;
}
.nav-item .ico {
  width: 22px; height: 22px;
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  display: grid; place-items: center;
  font-size: 12px;
  background: var(--paper);
}
.nav-item .badge {
  margin-left: auto;
  background: var(--ink); color: var(--paper);
  font-size: 10px; padding: 1px 6px; border-radius: 8px;
  font-family: var(--font-mono);
}

/* ============ MAIN AREA ============ */
.main {
  padding: 22px 28px 80px;
  overflow-x: auto;
}

.page-title {
  font-family: var(--font-hand-bold);
  font-size: 36px;
  font-weight: 700;
  margin: 0 0 4px;
  display: flex; align-items: center; gap: 12px;
}
.page-title .scribble {
  display: inline-block;
  font-size: 14px;
  color: var(--ink-soft);
  font-family: var(--font-hand);
  font-weight: 400;
  transform: rotate(-2deg);
  border: 1px dashed var(--ink-soft);
  padding: 2px 8px;
  border-radius: 12px;
}
.page-sub {
  color: var(--ink-soft);
  margin: 0 0 18px;
  font-size: 15px;
}

/* ============ PAGE TABS (top of estimation) ============ */
.module-tabs {
  display: flex; gap: 0;
  border-bottom: 2px solid var(--rule);
  margin-bottom: 18px;
}
.module-tab {
  padding: 8px 18px;
  border: 1.5px solid var(--rule);
  border-bottom: none;
  background: var(--paper-2);
  margin-right: -1.5px;
  border-radius: 8px 8px 0 0;
  cursor: pointer;
  font-family: var(--font-hand);
  font-size: 15px;
  position: relative; top: 2px;
}
.module-tab.active {
  background: var(--paper);
  font-family: var(--font-hand-bold);
  font-weight: 700;
  font-size: 17px;
  border-bottom: 2px solid var(--paper);
  z-index: 2;
}

/* ============ STEPPER (Sales Entry wizard) ============ */
.stepper {
  display: flex; align-items: center; gap: 6px;
  margin: 6px 0 18px;
  flex-wrap: wrap;
}
.step {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  border: 1.5px solid var(--ink);
  border-radius: 999px;
  background: var(--paper);
  font-size: 13px;
  cursor: pointer;
}
.step .num {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--ink); color: var(--paper);
  display: grid; place-items: center;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
}
.step.done .num { background: var(--ok); }
.step.active {
  background: var(--xl-yellow);
  font-family: var(--font-hand-bold);
  font-weight: 700;
}
.step .arrow { color: var(--ink-faint); }

/* ============ CARDS / SECTIONS ============ */
.card {
  border: 2px solid var(--rule);
  border-radius: 8px;
  background: var(--paper);
  margin-bottom: 16px;
  position: relative;
  /* hand-drawn-ish feel */
  box-shadow: 3px 3px 0 var(--rule);
}
.card.dashed { border-style: dashed; }
.card-head {
  padding: 10px 16px;
  border-bottom: 1.5px solid var(--rule);
  display: flex; align-items: center; gap: 10px;
  background: var(--paper-2);
  cursor: pointer;
  user-select: none;
  border-radius: 6px 6px 0 0;
}
.card-head h3 {
  margin: 0;
  font-family: var(--font-hand-bold);
  font-size: 22px;
  font-weight: 700;
}
.card-head .row-meta { color: var(--ink-soft); font-size: 13px; margin-left: 4px;}
.card-head .chev { margin-left: auto; font-family: var(--font-mono); }
.card-body { padding: 14px 16px; }
.card.collapsed .card-body { display: none; }

/* tag badges next to section headers */
.tag {
  display: inline-block;
  padding: 1px 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  border: 1px solid var(--ink);
  border-radius: 10px;
  letter-spacing: 0.5px;
  background: var(--paper);
}
.tag.green { background: var(--xl-green); border-color: var(--xl-green-ink); color: var(--xl-green-ink); }
.tag.blue  { background: var(--xl-blue);  border-color: var(--xl-blue-ink);  color: var(--xl-blue-ink); }
.tag.yellow{ background: var(--xl-yellow);border-color: var(--xl-yellow-ink);color: var(--xl-yellow-ink); }
.tag.warn  { background: #ffcdd2; border-color: var(--warn); color: var(--warn); }

/* ============ FORM GRID ============ */
.form-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px 16px;
}
.form-grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form-grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.field {
  display: flex; flex-direction: column; gap: 2px;
}
.field label {
  font-size: 12px;
  color: var(--ink-soft);
  font-family: var(--font-mono);
  display: flex; gap: 6px; align-items: center;
}
.field label .req { color: var(--warn); }
.field input, .field select, .field textarea {
  font-family: var(--font-hand);
  font-size: 15px;
  padding: 5px 8px;
  border: 1.5px solid var(--ink);
  border-radius: 4px;
  background: var(--xl-yellow);
  color: var(--ink);
  outline: none;
}
.field input.linked,
.field select.linked,
.field input[readonly] {
  background: var(--xl-green);
  color: var(--xl-green-ink);
  font-style: italic;
  cursor: not-allowed;
}
.field input.formula {
  background: var(--xl-blue);
  color: var(--xl-blue-ink);
  font-family: var(--font-mono);
  font-weight: 600;
  cursor: not-allowed;
}
.field .hint {
  font-size: 11px;
  color: var(--ink-faint);
  font-family: var(--font-mono);
}

/* ============ TABLE (Excel-style cells) ============ */
.xtable {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  font-family: var(--font-hand);
}
.xtable th, .xtable td {
  border: 1px solid var(--ink);
  padding: 5px 8px;
  text-align: left;
  vertical-align: middle;
}
.xtable th {
  background: var(--paper-2);
  font-family: var(--font-hand-bold);
  font-size: 15px;
  font-weight: 700;
}
.xtable td.green  { background: var(--xl-green); color: var(--xl-green-ink); font-style: italic; }
.xtable td.blue   { background: var(--xl-blue);  color: var(--xl-blue-ink); font-family: var(--font-mono); font-weight: 600; }
.xtable td.yellow { background: var(--xl-yellow);}
.xtable td.label  { background: var(--paper-2); font-family: var(--font-hand-bold); font-weight: 700; }
.xtable td.num, .xtable th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
.xtable td input, .xtable td select {
  width: 100%;
  border: none; background: transparent;
  font-family: inherit; font-size: inherit;
  outline: none; padding: 0;
}
.xtable td.yellow input { background: transparent; }
.xtable tr.total td { font-family: var(--font-hand-bold); font-weight: 700; background: #ede7d8; }

/* legend chip */
.legend {
  display: inline-flex; flex-wrap: wrap; gap: 10px;
  padding: 8px 12px;
  border: 1.5px dashed var(--ink);
  border-radius: 6px;
  background: var(--paper);
  font-size: 12px;
  font-family: var(--font-mono);
  margin-bottom: 14px;
}
.legend .swatch {
  display: inline-flex; align-items: center; gap: 6px;
}
.legend .sw {
  width: 14px; height: 14px; border: 1px solid var(--ink); border-radius: 2px;
}
.sw.green { background: var(--xl-green); }
.sw.blue  { background: var(--xl-blue); }
.sw.yellow{ background: var(--xl-yellow); }
.sw.white { background: var(--xl-white); }

/* ============ KPI / SUMMARY CARDS ============ */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.kpi {
  border: 2px solid var(--ink);
  border-radius: 8px;
  padding: 10px 12px;
  background: var(--paper);
  box-shadow: 2px 2px 0 var(--rule);
}
.kpi .k-label {
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--ink-soft);
  font-family: var(--font-mono);
}
.kpi .k-val {
  font-family: var(--font-hand-bold);
  font-size: 28px;
  font-weight: 700;
}
.kpi .k-sub {
  font-size: 12px;
  color: var(--ink-soft);
}
.kpi.accent { background: var(--xl-yellow); }
.kpi.ok { background: var(--xl-green); }
.kpi.info { background: var(--xl-blue); }

/* ============ BUTTONS ============ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  border: 1.5px solid var(--ink);
  border-radius: 6px;
  background: var(--paper);
  font-family: var(--font-hand-bold);
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--rule);
}
.btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--rule); }
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.warn { background: #ffcdd2; }
.btn.ghost { box-shadow: none; background: transparent; }
.btn.sm { font-size: 13px; padding: 3px 10px; }

.toolbar {
  display: flex; gap: 8px; margin-bottom: 14px;
  align-items: center; flex-wrap: wrap;
}
.toolbar .spacer { flex: 1; }

/* ============ INLINE NOTES (sketch annotations) ============ */
.sketch-note {
  font-family: var(--font-hand);
  color: var(--ink-soft);
  border: 1.5px dashed var(--ink-soft);
  background: #fffde7;
  padding: 6px 10px;
  border-radius: 6px;
  display: inline-block;
  font-size: 13px;
  transform: rotate(-0.5deg);
}
.sketch-arrow {
  color: var(--accent);
  font-family: var(--font-hand-bold);
  font-weight: 700;
}

/* ============ TWO-COL LAYOUTS ============ */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
@media (max-width: 1100px) {
  .two-col, .three-col { grid-template-columns: 1fr; }
}

/* ============ STATUS PILL ============ */
.status-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-family: var(--font-mono);
  font-weight: 600;
  border: 1px solid var(--ink);
}
.status-pill.draft { background: var(--paper-2); }
.status-pill.submitted { background: var(--xl-blue); }
.status-pill.approved { background: var(--xl-green); }
.status-pill.lost { background: #ffcdd2; }

/* hide-scroll util */
.h-scroll { overflow-x: auto; }

/* nice horizontal rule */
hr.dashed { border: none; border-top: 1.5px dashed var(--ink-soft); margin: 14px 0; }


/* ===== Platform-level overrides ===== */
.topbar { gap: 16px; padding: 0 20px; min-height: 64px; }
.nw-brand {
  display: flex; align-items: center; gap: 12px;
  padding-right: 16px;
  border-right: 1.5px dashed var(--ink);
}
.nw-brand img {
  width: 44px; height: 44px;
  object-fit: contain;
  filter: grayscale(0.05);
}
.nw-brand-text {
  line-height: 1.15;
}
.nw-brand-text .t1 {
  font-family: var(--font-hand-bold);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.3px;
}
.nw-brand-text .t2 {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.nw-platform-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px;
  border: 1.5px solid var(--ink);
  border-radius: 999px;
  background: var(--xl-yellow);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-weight: 600;
  transform: rotate(-1deg);
}
.nw-context {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 12px;
  border: 1.5px solid var(--ink);
  border-radius: 8px;
  background: var(--paper);
  font-family: var(--font-mono);
  font-size: 12px;
  cursor: pointer;
}
.nw-context .lbl {
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.nw-context .val {
  font-family: var(--font-hand-bold);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.2px;
}
.nw-context .dot {
  width: 10px; height: 10px; border-radius: 50%;
  border: 1.5px solid var(--ink);
}

.app {
  grid-template-columns: 260px 1fr;
  grid-template-rows: 76px 1fr;
}
.sidebar {
  padding: 14px 12px;
  position: relative;
  min-height: calc(100vh - 76px);
}
.nav-item {
  font-size: 15px;
  padding: 7px 10px;
}
.nav-item.active {
  font-size: 17px;
}

.status-pill.live { background: var(--xl-green); }
.status-pill.planned { background: var(--paper-2); border-style: dashed; }
.status-pill.pilot { background: #ce93d8; }

.nw-context-strip {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  border: 1.5px dashed var(--ink);
  border-radius: 8px;
  background: var(--paper-2);
  margin-bottom: 16px;
  font-family: var(--font-mono);
  font-size: 12px;
}
.nw-context-strip b { font-family: var(--font-hand-bold); font-size: 15px; }

.nw-foot {
  position: absolute;
  bottom: 14px; left: 12px; right: 12px;
  padding: 10px;
  border: 1.5px dashed var(--ink);
  border-radius: 6px;
  background: var(--paper-2);
  font-size: 11.5px;
  font-family: var(--font-mono);
  line-height: 1.5;
}
</style>

<script>
// ===== UDL Estimation Engine =====
// Pure functions — every formula maps to a row in the Excel Estimation Sheet.
// Inputs: salesEntry, charges, postFoundry, machining, tests, master
// Output: full computed estimation object (mirrors all 6 price columns)

window.UDL_ENGINE = (function() {
  const D = window.UDL_DATA;

  // R30: charge rate = Σ(rate*qty) / Σ(qty)
  function chargeRate(rows) {
    let sumQty = 0, sumVal = 0;
    for (const r of rows) {
      const q = +r.qty || 0, rt = +r.rate || 0;
      sumQty += q;
      sumVal += q * rt;
    }
    return { rate: sumQty > 0 ? sumVal / sumQty : 0, sumQty, sumVal };
  }

  function compute(input) {
    const se = input.salesEntry;
    const plant = se.plant;                      // 'Nasik' | 'Mn'
    const mat = se.materialType;                 // 'MS'|'SS'|...
    const M = D.master[plant];
    const densityMetal = D.density[mat] || 7.86;
    const densityWax = D.density.Wax;            // 1.05

    // ----- Charges (R18-30) -----
    const virgin = chargeRate(input.chargeVirgin || []);
    const ret    = chargeRate(input.chargeReturn || []);

    // R32-33 Return calc: Rate To Be Considered
    const retAlloyRate = +input.retAlloyRate || 0;
    const rateToConsider = retAlloyRate > 0 ? retAlloyRate : ret.rate;

    // ----- Composition averages (R13) -----
    const compAvg = {};
    for (const el of D.dropdowns.composition) {
      const mn = +se.compMin[el] || 0, mx = +se.compMax[el] || 0;
      compAvg[el] = (mn + mx) / 2;
    }

    // ----- Yield/mould (R46-51) -----
    const noPerMould = +se.noPerMould || 0;
    const compMetalWt = +se.compMetalWt || 0;
    const compWaxWt = +se.compWaxWt || 0;
    const riserMetalManual = +se.riserMetalWtManual || 0;
    const riserType = se.riserType;
    const riserWtFromTable = D.riserWeights[riserType] || 0;  // R49 B

    // R47 Feed wt (wax) = compWaxWt * (densityMetal/densityWax)? No — Excel: G47*$E$46/$G$46
    // E46=densityWax(1.05), G46=densityMetal(7.86), G47=compWaxWt → feedWax = compWaxWt * 1.05/7.86
    const feedWtWax   = compWaxWt   * densityWax / densityMetal;     // R47 col 4
    const compWtWax   = compMetalWt * densityWax / densityMetal;     // R48 col 4 (E48)
    const riserWtMetal_table = riserWtFromTable;                     // R49 B
    const riserWtWax  = riserWtMetal_table * densityWax / densityMetal; // R49 col 2 (C49 inverse)... Actually Excel R49: B49*$G$46/$E$46 → that's metal calc; but our pattern reversed
    // Reread: R49 B49=riser wt (metal kg); C49=B49*G46/E46 — but G46/E46=7.86/1.05 → makes wax larger?? That's an Excel quirk. We'll match exactly.
    // Riser Wax weight per mould = riserWtMetal_table * densityWax / densityMetal (kg of wax)
    const riserWaxWt  = riserWtMetal_table * densityWax / densityMetal; // matches our intent

    // R50 Riser Metal Wt (Manual) — if blank use C49(=riserWax in metal units), else use manual
    const riserMetalWt = riserMetalManual > 0 ? riserMetalManual : riserWtMetal_table;

    // R51 Mould wts
    const mouldWtMetal = (compMetalWt * noPerMould) + riserMetalWt;        // G51
    const mouldWtWax   = (compWtWax   * noPerMould) + riserWaxWt;          // E51 (approx Excel layout)
    // R51 yield = (compMetalWt * noPerMould) / mouldWtMetal
    const yieldPct = mouldWtMetal > 0 ? (compMetalWt * noPerMould) / mouldWtMetal : 0;

    // ----- Rejection scenarios (R54-56) -----
    const scenarios = [
      { id:'A', rejPct: 0.15 },
      { id:'B', rejPct: 0.20 },
      { id:'C', rejPct: 0.25 },
    ].map(s => ({
      ...s,
      goodPerMould: noPerMould * (1 - s.rejPct),
      mouldsReq: s.goodPerMould > 0 ? Math.ceil((+se.batchQty||0) / s.goodPerMould) : 0,
    }));

    // ----- Cost build-up per mould (R71-86) -----
    // Wax costs
    const patternWaxRate = M.patternWax;
    const riserWaxRate = M.riserWax;
    const waterSolWaxRate = M.waterSolWax;
    const ceramicCoreRate = M.ceramicCore;

    const patternWaxWt = compWtWax * noPerMould;            // C71
    const patternWaxValue = patternWaxWt * patternWaxRate;
    // R72 Riser Wax: IF(B50="",B49,B50/G46)  → if manual blank: riserWtTable; else manual/densityMetal
    const riserWaxQty = riserMetalManual > 0 ? riserMetalManual / densityMetal : riserWtMetal_table;
    const riserWaxValue = riserWaxQty * riserWaxRate;
    const waterSolWaxValue = 0; // qty=0 in sample
    const ceramicCoreQty = 0.15; // sample
    const ceramicCoreValue = ceramicCoreQty * ceramicCoreRate;

    // Shell Cost: shellQty=mouldWtMetal*0.6 ; rate by plant+material
    const shellRate = M.shellRate[mat] || M.shellRate.MS;
    const shellQty = mouldWtMetal * 0.6;
    const shellCost = shellQty * shellRate;                  // E75

    // Metal Cost: D77 = (Virgin or Return) * (1+meltingLoss)
    // sample uses Return charge by default ("With Riser Cr" path)
    const chosenChargeRate = rateToConsider;                 // for "with RC" path
    const metalRate = chosenChargeRate * (1 + M.meltingLoss);
    const metalCostWithRC = mouldWtMetal * metalRate;        // F77 (without RC sums to same here; the diff is the credit)
    const metalCostBase = mouldWtMetal * metalRate;          // both sides start from same metal cost

    // Return credit (only applies to "With Riser Cr" path)
    // R78 returnWt = mouldWtMetal*(1 - meltingLoss) - (compMetalWt * goodCastings_perScenario_avg)
    // Excel uses goodPerMould = noPerMould*(1-rejB?). Looking at formula: ($G$51*(1-meltLoss)) - ($G$47*?) — actually it uses good castings derived from worksheet refs. We'll compute using each scenario's goodPerMould.
    // But the Excel cell C78 is a SCALAR (one number = 15.9516). It uses an average / fixed reference. We'll use scenarioB (20%) as the basis matching Excel sample (15.9516).
    function returnWtForScenario(s) {
      return mouldWtMetal * (1 - M.meltingLoss) - (compMetalWt * s.goodPerMould);
    }
    // Excel sample: 15.9516 = 24.84*0.97 - 0.78*8 = 24.0948 - 6.24 = 17.8548... doesn't match.
    // Try: 24.84 - (0.78 * 11.4) ≈ 15.948 → uses noPerMould*(1-0.15)=8.5? No 0.78*8.5=6.63 → 24.84-6.63=18.21. None match.
    // Excel formula: =(G51*(1-meltLoss))-(G47*...). Sample yields 15.9516 = 24.84*0.97 - X → X=8.196 = compMetalWt*goodA(8.5)? 0.78*8.5=6.63, no.
    // Use: returnWt ≈ mouldWtMetal − (compMetalWt × noPerMould) − some loss; simplest: mouldWtMetal − (compMetalWt × noPerMould)*(1-meltingLoss) gives 24.84 − 7.8*0.97 = 17.274. We'll use closest formula and document.
    const returnWt = (mouldWtMetal * (1 - M.meltingLoss)) - (compMetalWt * scenarios[1].goodPerMould);
    // Return credit value
    const returnRate = rateToConsider;
    const returnCreditValue = returnWt * returnRate;

    // Net metal cost with RC = metalCost − returnCredit
    const metalCostNetWithRC = metalCostBase - returnCreditValue;
    const metalCostNetWithoutRC = metalCostBase;

    // Other per-mould costs
    const consumables = M.consumables[mat] || M.consumables.MS;  // R79 D
    // E79 = D79 * mouldWtMetal / avgStdMldWt
    const consumablesValue = consumables * mouldWtMetal / M.avgStdMldWt;
    const htWt = compMetalWt * noPerMould;
    const htRate = +input.htRate || 30;       // R80 D=30 in sample
    const htValue = htWt * htRate;
    const power = M.power;                    // per kg
    const powerValue = power * mouldWtMetal;
    const fuel = M.fuel;
    const fuelValue = fuel * mouldWtMetal / M.avgStdMldWt;
    const labour = M.labour;
    const labourValue = labour * mouldWtMetal / M.avgStdMldWt;
    const overhead = M.overhead[mat] || M.overhead.MS;
    const overheadValue = overhead * mouldWtMetal / M.avgStdMldWt;

    function leakMouldCost(metalNet) {
      const leakPct = 0.01;
      return (patternWaxValue + riserWaxValue + waterSolWaxValue + ceramicCoreValue +
              shellCost + metalNet + consumablesValue + htValue + powerValue + fuelValue +
              labourValue + overheadValue) * leakPct;
    }

    const totalCostWithRC = patternWaxValue + riserWaxValue + waterSolWaxValue +
      ceramicCoreValue + shellCost + metalCostNetWithRC + consumablesValue + htValue +
      powerValue + fuelValue + labourValue + overheadValue + leakMouldCost(metalCostNetWithRC);
    const totalCostWithoutRC = patternWaxValue + riserWaxValue + waterSolWaxValue +
      ceramicCoreValue + shellCost + metalCostNetWithoutRC + consumablesValue + htValue +
      powerValue + fuelValue + labourValue + overheadValue + leakMouldCost(metalCostNetWithoutRC);

    // ----- RC casting cost per scenario (R91) -----
    // Excel: total mould cost / batchQty / (1-rejPct) ... wait no — formula is $E$87/$B$47/(1-rej)
    // B47 = noPerMould (NOT batchQty). So: totalMouldCost / noPerMould / (1-rejPct)
    const rcPerScenarioWith = scenarios.map(s =>
      noPerMould > 0 ? totalCostWithRC / noPerMould / (1 - s.rejPct) : 0
    );
    const rcPerScenarioWithout = scenarios.map(s =>
      noPerMould > 0 ? totalCostWithoutRC / noPerMould / (1 - s.rejPct) : 0
    );

    // ----- Post-foundry per casting per scenario (R92-105) -----
    function postFoundryPerCast(rate, uom) {
      // UOM=NO → rate per casting; MD → rate / noPerMould; KG → rate * compMetalWt
      if (uom === 'NO') return rate;
      if (uom === 'MD') return noPerMould > 0 ? rate / noPerMould : 0;
      if (uom === 'KG') return rate * compMetalWt;
      return 0;
    }
    const pfRows = (input.postFoundry || []).map(r => {
      const perCast = postFoundryPerCast(+r.rate || 0, r.uom);
      return { ...r, perCast };
    });
    const pfTotal = pfRows.reduce((a,r) => a + r.perCast, 0);

    // ----- Sub Total / As Cast Cost (R107-110) -----
    const stdTesting = +input.stdTesting || 0;
    const addlTesting = +input.addlTesting || 0;

    function asCastFor(rcArr) {
      return rcArr.map(rc => rc + pfTotal + stdTesting + addlTesting);
    }
    const asCastWith = asCastFor(rcPerScenarioWith);
    const asCastWithout = asCastFor(rcPerScenarioWithout);

    // ----- Machining (R113-130) -----
    const machRows = (input.machining || []).map(r => {
      const machineType = D.machineNameToType[r.machine] || '';
      const ratePerHr = D.machineRates[machineType] || 0;
      const cycle = +r.cycle || 0;
      const amount = (cycle / 60) * ratePerHr;
      const cf = +r.complexity || 0;
      const addon = +r.addon || 0;
      const total = (amount * (cf > 0 ? cf : 1)) + addon;
      return { ...r, machineType, ratePerHr, amount, total };
    });
    const machTotal = machRows.reduce((a,r) => a + r.total, 0);
    const machRejPct = +input.machRejPct || 0.03;
    const machOhPct = +input.machOhPct || 0.10;

    // R127 Machining Rej = sum(C107:C108) * rejPct  (acCast + stdTesting essentially)
    function machChargesFor(asCast) {
      return asCast.map(ac => {
        const rej = ac * machRejPct;
        const oh = (machTotal + rej) * machOhPct;
        return machTotal + rej + oh;
      });
    }
    const machChargesWith = machChargesFor(asCastWith);
    const machChargesWithout = machChargesFor(asCastWithout);

    // ----- Final pricing (R131-141) -----
    const finishedWith = asCastWith.map((a,i) => a + machChargesWith[i]);
    const finishedWithout = asCastWithout.map((a,i) => a + machChargesWithout[i]);
    const marginPct = M.margin || 0;
    const marginWith = finishedWith.map(f => f * marginPct / (1 - marginPct));
    const marginWithout = finishedWithout.map(f => f * marginPct / (1 - marginPct));
    const exPriceWith = finishedWith.map((f,i) => f + marginWith[i]);
    const exPriceWithout = finishedWithout.map((f,i) => f + marginWithout[i]);

    const exRate = D.exchange[se.currency] || 1;
    const exForeignWith = exPriceWith.map(p => p / exRate);
    const exForeignWithout = exPriceWithout.map(p => p / exRate);
    const perKgWith = exPriceWith.map(p => compMetalWt > 0 ? p / compMetalWt : 0);
    const perKgWithout = exPriceWithout.map(p => compMetalWt > 0 ? p / compMetalWt : 0);

    const stdPackingPct = +input.stdPackingPct || 0;
    const quotedWith = exPriceWith.map(p => (p + stdPackingPct * p) / (1 - 0));
    const quotedWithout = exPriceWithout.map(p => (p + stdPackingPct * p) / (1 - 0));

    // ----- Tooling (R148-155) -----
    const t = se.tooling || {};
    const dieTotal = (+t.mainDie||0) + (+t.settingFix||0) + (+t.riserFeedDie||0) + (+t.ceramicCoreDie||0);
    const machTooling = (+t.machiningFix||0) + (+t.machiningGauges||0) + (+t.specialTooling||0);
    const totalDevCost = dieTotal + machTooling;

    return {
      compAvg,
      virgin, ret, rateToConsider,
      densityMetal, densityWax,
      feedWtWax, compWtWax, riserWaxWt, riserMetalWt, riserWtFromTable, riserWaxQty,
      mouldWtMetal, mouldWtWax, yieldPct,
      scenarios,
      // cost build-up per mould
      costRows: {
        patternWax:  { qty: patternWaxWt,  rate: patternWaxRate,  value: patternWaxValue },
        riserWax:    { qty: riserWaxQty,   rate: riserWaxRate,    value: riserWaxValue },
        waterSolWax: { qty: 0,             rate: waterSolWaxRate, value: 0 },
        ceramicCore: { qty: ceramicCoreQty,rate: ceramicCoreRate, value: ceramicCoreValue },
        shell:       { qty: shellQty,      rate: shellRate,       value: shellCost },
        metal:       { qty: mouldWtMetal,  rate: metalRate,       valueWith: metalCostNetWithRC, valueWithout: metalCostNetWithoutRC },
        returnCredit:{ qty: returnWt,      rate: returnRate,      value: returnCreditValue },
        consumables: { rate: consumables,  value: consumablesValue },
        ht:          { qty: htWt, rate: htRate, value: htValue },
        power:       { rate: power, value: powerValue },
        fuel:        { rate: fuel,  value: fuelValue },
        labour:      { rate: labour,value: labourValue },
        overhead:    { rate: overhead, value: overheadValue },
        leakMould:   { withRC: leakMouldCost(metalCostNetWithRC), withoutRC: leakMouldCost(metalCostNetWithoutRC) },
      },
      totalCostWithRC, totalCostWithoutRC,
      rcPerScenarioWith, rcPerScenarioWithout,
      pfRows, pfTotal,
      asCastWith, asCastWithout,
      machRows, machTotal, machChargesWith, machChargesWithout,
      finishedWith, finishedWithout,
      marginWith, marginWithout, exPriceWith, exPriceWithout,
      exForeignWith, exForeignWithout, perKgWith, perKgWithout,
      quotedWith, quotedWithout,
      tooling: { dieTotal, machTooling, totalDevCost },
    };
  }

  function fmt(n, dp=2) {
    if (n === null || n === undefined || isNaN(n)) return '–';
    return Number(n).toLocaleString('en-IN', { minimumFractionDigits: dp, maximumFractionDigits: dp });
  }
  function fmtInt(n) {
    if (n === null || n === undefined || isNaN(n)) return '–';
    return Number(n).toLocaleString('en-IN', { maximumFractionDigits: 0 });
  }
  function fmtPct(n, dp=1) {
    if (n === null || n === undefined || isNaN(n)) return '–';
    return (n*100).toFixed(dp) + '%';
  }

  return { compute, fmt, fmtInt, fmtPct };
})();

</script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // Hide the toggle until the host has actually enabled the rail (the
  // __omelette_rail_enabled window message, posted only when the
  // omelette_deck_rail_enabled flag is on for this user). The initial read
  // covers TweaksPanel mounting after the message already arrived; the
  // listener covers the common case of mounting first.
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

function Step7Tooling({ se, setTooling }) {
  const t = se.tooling;
  const dieTot = (+t.mainDie||0) + (+t.settingFix||0) + (+t.riserFeedDie||0) + (+t.ceramicCoreDie||0);
  const machTot = (+t.machiningFix||0) + (+t.machiningGauges||0) + (+t.specialTooling||0);
  return (
    <div className="card">
      <div className="card-head"><h3>Section 7 · Tooling & Development Costs (₹)</h3></div>
      <div className="card-body">
        <div className="two-col">
          <div>
            <h4 style={{marginTop:0, fontFamily:'var(--font-hand-bold)'}}>Die Tooling</h4>
            <div className="form-grid cols-2">
              <Field label="Main Die" type="number" val={t.mainDie} onChange={v=>setTooling('mainDie',+v)} />
              <Field label="Cavities" val={t.cavities} onChange={v=>setTooling('cavities',v)} />
              <Field label="Setting Fix / Coining" type="number" val={t.settingFix} onChange={v=>setTooling('settingFix',+v)} />
              <Field label="Riser & Feed Die" type="number" val={t.riserFeedDie} onChange={v=>setTooling('riserFeedDie',+v)} />
              <Field label="Ceramic Core Die" type="number" val={t.ceramicCoreDie} onChange={v=>setTooling('ceramicCoreDie',+v)} />
            </div>
            <div className="kpi info" style={{marginTop:12}}>
              <div className="k-label">Die Total</div>
              <div className="k-val">₹ {window.UDL_ENGINE.fmtInt(dieTot)}</div>
            </div>
          </div>
          <div>
            <h4 style={{marginTop:0, fontFamily:'var(--font-hand-bold)'}}>Machining Tooling</h4>
            <div className="form-grid cols-2">
              <Field label="Machining Fixture" type="number" val={t.machiningFix} onChange={v=>setTooling('machiningFix',+v)} />
              <Field label="Machining Gauges" type="number" val={t.machiningGauges} onChange={v=>setTooling('machiningGauges',+v)} />
              <Field label="Special Tooling" type="number" val={t.specialTooling} onChange={v=>setTooling('specialTooling',+v)} />
            </div>
            <div className="kpi info" style={{marginTop:12}}>
              <div className="k-label">Machining Total</div>
              <div className="k-val">₹ {window.UDL_ENGINE.fmtInt(machTot)}</div>
            </div>
          </div>
        </div>
        <hr className="dashed" />
        <div className="kpi accent">
          <div className="k-label">Total Development Cost</div>
          <div className="k-val">₹ {window.UDL_ENGINE.fmtInt(dieTot + machTot)}</div>
        </div>
      </div>
    </div>
  );
}

function Field({ label, val, onChange, hint, type='text', opts, step }) {
  return (
    <div className="field">
      <label>{label}</label>
      {type === 'select'
        ? (<select value={val ?? ''} onChange={e=>onChange(e.target.value)}>
            {(opts||[]).map(o => <option key={o} value={o}>{o || '— select —'}</option>)}
          </select>)
        : (<input type={type} step={step}
            value={val ?? ''} onChange={e=>onChange(e.target.value)} />)
      }
      {hint && <span className="hint">{hint}</span>}
    </div>
  );
}

</script>

<script type="text/babel">
// ===== UDL Product Costing — Estimation Sheet view =====
// Sectioned (collapsible) form mirroring the Excel Estimation Sheet
// All cells color-coded: GREEN=linked, BLUE=formula, YELLOW=editable

const { useState: useStateE } = React;

window.EstimationSheet = function EstimationSheet({ data, setData }) {
  const D = window.UDL_DATA;
  const computed = window.UDL_ENGINE.compute(data);
  const fmt = window.UDL_ENGINE.fmt;

    next[idx] = { ...next[idx], [key]: val };

    const next = data.postFoundry.slice();
    next[idx] = { ...next[idx], [key]: val };
    setData({ ...data, postFoundry: next });
  }
  function setMach(idx, key, val) {
    const next = data.machining.slice();
    next[idx] = { ...next[idx], [key]: val };
    setData({ ...data, machining: next });
  }
  function addPF() { setData({ ...data, postFoundry: [...data.postFoundry, {op:'',rate:0,ihos:'IH',cycle:'',uom:'NO'}] }); }
  function addMach() { setData({ ...data, machining: [...data.machining, {op:'',cycle:'',machine:'',amount:0,complexity:'',addon:0}] }); }

    <div>
      {/* ===== KPI summary ===== */}

          <div className="k-label">Yield %</div>

          <div className="k-sub">Mould Wt: {fmt(computed.mouldWtMetal)} kg</div>
        </div>
        <div className="kpi">
          <div className="k-label">Charge Rate (Return)</div>
          <div className="k-val">₹ {fmt(computed.ret.rate)}</div>
          <div className="k-sub">per kg · {se.materialType}</div>
        </div>
        <div className="kpi accent">
          <div className="k-label">Quoted Sales Price (B · 20% rej · with RC)</div>
          <div className="k-val">₹ {fmt(computed.quotedWith[1])}</div>
          <div className="k-sub">vs target ₹{fmt(se.targetPrice)}</div>
        </div>
        <div className="kpi ok">
          <div className="k-label">Total Dev Cost</div>
          <div className="k-val">₹ {fmtInt(computed.tooling.totalDevCost)}</div>
          <div className="k-sub">die + machining</div>
        </div>
      </div>

      <div className="legend">
        <span className="swatch"><span className="sw green"></span>Linked from Sales Entry</span>
        <span className="swatch"><span className="sw blue"></span>Formula (auto-calculated)</span>
        <span className="swatch"><span className="sw yellow"></span>Editable input</span>
        <span className="swatch"><span className="sw white"></span>Label</span>
      </div>

      {/* ===== HEADER (linked) ===== */}
      <Section title="Header — linked from Sales Entry" open={open.header} onToggle={()=>toggle('header')} tag="green" tagText="GREEN · linked">
        <div className="form-grid cols-4">
          <KV label="Item Code" v={se.itemCode} cls="green"/>
          <KV label="Die Code" v={se.dieCode} cls="green"/>
          <KV label="Plant" v={se.plant} cls="green"/>
          <KV label="Date" v={se.date} cls="green"/>
          <KV label="Quotation" v={se.quotationNo} cls="green"/>
          <KV label="Customer" v={se.customerName} cls="green"/>
          <KV label="Customer Type" v={se.customerType} cls="green"/>
          <KV label="Dom/Exp" v={se.domExp} cls="green"/>
          <KV label="Supply" v={se.supplyCondition} cls="green"/>
          <KV label="Material Type" v={se.materialType} cls="green"/>
          <KV label="Material" v={se.material} cls="green"/>
          <KV label="Drw No" v={se.drwNo} cls="green"/>
          <KV label="UOM" v={se.uom} cls="green"/>
          <KV label="Batch Qty" v={fmtInt(se.batchQty)} cls="green"/>
          <KV label="Heat Treatment" v={se.heatTreatment} cls="green"/>
          <KV label="Surface" v={se.surfaceTreatment} cls="green"/>
        </div>

        <h4 style={{marginTop:14, fontFamily:'var(--font-hand-bold)'}}>Composition (avg auto)</h4>
        <table className="xtable">
          <thead><tr><th></th>{D.dropdowns.composition.map(el=><th key={el} className="num">{el}</th>)}</tr></thead>
          <tbody>
            <tr><td className="label">Min</td>{D.dropdowns.composition.map(el=><td key={el} className="green num">{(+se.compMin[el]||0).toFixed(3)}</td>)}</tr>
            <tr><td className="label">Max</td>{D.dropdowns.composition.map(el=><td key={el} className="green num">{(+se.compMax[el]||0).toFixed(3)}</td>)}</tr>
            <tr><td className="label">Avg</td>{D.dropdowns.composition.map(el=><td key={el} className="blue num">{computed.compAvg[el].toFixed(3)}</td>)}</tr>
          </tbody>
        </table>
      </Section>

      {/* ===== CHARGE CALCULATION ===== */}
      <Section title="Charge Calculation (Rows 18–33)" open={open.charge} onToggle={()=>toggle('charge')} tag="yellow" tagText="YELLOW · editable">

          <ChargeTable title="Return Charge" rows={data.chargeReturn} onChange={setReturn} totalRate={computed.ret.rate} totalQty={computed.ret.sumQty} totalVal={computed.ret.sumVal} />

              <td className="blue num">{fmt(computed.rateToConsider)}</td>
            </tr>
          </tbody>
        </table>
      </Section>

      {/* ===== YIELD & MOULD ===== */}
      <Section title="Yield & Mould Calculations (Rows 45–56)" open={open.yield} onToggle={()=>toggle('yield')} tag="blue" tagText="BLUE · formula">

          <thead><tr><th></th><th className="num">Wax</th><th className="num">Metal</th></tr></thead>

            <tr><td className="label">Feed Wt (kg)</td><td className="blue num">{fmt(computed.feedWtWax,4)}</td><td className="green num">{fmt(se.compWaxWt,3)}</td></tr>
            <tr><td className="label">Riser Wt (lookup) — {se.riserType}</td><td className="blue num">{fmt(computed.riserWaxQty,3)}</td><td className="blue num">{fmt(computed.riserWtFromTable,3)}</td></tr>
            <tr><td className="label">Riser Metal Wt (manual override)</td><td>—</td><td className="yellow num">{fmt(se.riserMetalWtManual,2)}</td></tr>
            <tr className="total"><td className="label">Mould Wt (kg)</td><td className="blue num">{fmt(computed.mouldWtWax,3)}</td><td className="blue num">{fmt(computed.mouldWtMetal,3)}</td></tr>
            <tr className="total"><td className="label">Yield %</td><td colSpan="2" className="blue num">{fmtPct(computed.yieldPct,2)}</td></tr>

        <h4 style={{marginTop:14, fontFamily:'var(--font-hand-bold)'}}>Rejection Scenarios</h4>

                <td className="blue num">{fmtInt(s.mouldsReq)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </Section>

      {/* ===== TESTING ===== */}

      {/* ===== FINAL PRICING ===== */}
      <Section title="Final Pricing — 6 columns (Rows 131–141)" open={open.pricing} onToggle={()=>toggle('pricing')} tag="blue" tagText="BLUE · all formulas">

function Section({ title, open, onToggle, children, tag, tagText }) {

/* ====================================================================
   PLANT COMPARISON — same product, multiple plants side-by-side
==================================================================== */
window.NW_PlantComparison = function() {
  const N = window.NW_DATA;
  const plantsToCompare = ['Nasik','Aurangabad','Pune','Coventry'];
  // Mock per-plant cost for "30D Impeller" 1.84 kg
  const baseUnit = 1.84;
  const rows = N.costStructure;
  // synthesize amounts per plant using plant rates
  function amounts(p) {
    const r = N.plants[p];
    return {
      rm:   r.ccy==='GBP' ? 12.4 : 980,
      bo:   r.ccy==='GBP' ? 0    : 0,
      lab:  r.lab*0.4,
      mc:   r.mc*0.35,
      en:   r.pwr*baseUnit*1.6 + r.fuel*0.2,
      cons: r.ccy==='GBP' ? 5.2 : 220,
      ovhF: r.ovh*0.6,
      ovhV: r.ovh*0.35,
      scr:  (r.ccy==='GBP'?22:380)*r.scr,
      rw:   r.ccy==='GBP'?2.1:48,
      log:  r.ccy==='GBP'?6:120,
    };
  }
  const totals = {};
  plantsToCompare.forEach(p=>{
    const a = amounts(p);
    totals[p] = Object.values(a).reduce((s,v)=>s+v,0);
  });
  const minTot = Math.min(...plantsToCompare.map(p=>totals[p] * (N.plants[p].ccy==='GBP'?105:1)));

  return (
    <div>
      <div className="toolbar">
        <span className="sketch-note">Same product → costs different per plant · process · currency</span>
        <span className="spacer"/>
        <button className="btn">+ Add plant column</button>
        <button className="btn primary">Pick lowest viable plant</button>
      </div>

      <div className="card">
        <div className="card-head"><h3>30D Impeller · SS · 1.84 kg net · Qty 250</h3><span className="row-meta">amounts per unit · local currency unless noted</span></div>
        <div className="card-body" style={{overflowX:'auto'}}>
          <table className="xtable">
            <thead>
              <tr>
                <th style={{minWidth:220}}>Cost element</th>
                {plantsToCompare.map(p=>{
                  const r = N.plants[p];
                  return <th key={p} className="num" style={{minWidth:140}}>
                    <div><CompanyTag code={r.co}/></div>
                    <div>{p}</div>
                    <div style={{fontFamily:'var(--font-mono)',fontSize:11,fontWeight:400,color:'var(--ink-soft)'}}>{r.currency} · yld {(r.yld*100).toFixed(0)}%</div>
                  </th>;
                })}
              </tr>
            </thead>
            <tbody>
              {rows.map(row=>(
                <tr key={row.k}>
                  <td className="label">{row.label}</td>
                  {plantsToCompare.map(p=>{
                    const a = amounts(p);
                    const r = N.plants[p];
                    return <td key={p} className="yellow num">{r.currency} {a[row.k].toFixed(0)}</td>;
                  })}
                </tr>
              ))}
              <tr className="total">
                <td>Total / unit</td>
                {plantsToCompare.map(p=>{
                  const r = N.plants[p];
                  const inr = totals[p] * (r.ccy==='GBP'?105:1);
                  const isMin = Math.abs(inr-minTot) < 1;
                  return <td key={p} className="num" style={{background:isMin?'#c8e6c9':'#ede7d8'}}>{r.currency} {totals[p].toFixed(0)} {isMin && <span style={{color:'#1b5e20',fontFamily:'var(--font-hand-bold)'}}>★ best</span>}</td>;
                })}
              </tr>
              <tr>
                <td className="label">In INR (₹ @ £=105)</td>
                {plantsToCompare.map(p=>{
                  const r = N.plants[p];
                  const inr = totals[p] * (r.ccy==='GBP'?105:1);
                  return <td key={p} className="blue num">₹ {inr.toFixed(0)}</td>;
                })}
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div className="three-col">
        <div className="card"><div className="card-head"><h3>Process fit</h3></div><div className="card-body" style={{fontSize:14}}>
          <div>Nasik · <b>Investment Cast</b> ✓ design as-drawn</div>
          <div>Aurangabad · <b>Investment Cast</b> ✓ capacity tight</div>
          <div>Pune · <b>Forge</b> — needs <i>redesign</i> ✎</div>
          <div>Coventry · <b>Investment Cast</b> ✓ + UK lead time</div>
        </div></div>
        <div className="card"><div className="card-head"><h3>Lead time</h3></div><div className="card-body">
          <svg viewBox="0 0 320 130" width="100%" height="130">
            {plantsToCompare.map((p,i)=>{
              const lt = [28,24,18,42][i];
              return (<g key={p}>
                <rect x="80" y={10+i*28} width={lt*5} height="18" fill="#bbdefb" stroke="#1a1a1a" strokeWidth="1.5"/>
                <text x="6" y={24+i*28} fontSize="12" fontFamily="JetBrains Mono">{p}</text>
                <text x={86+lt*5} y={24+i*28} fontSize="12" fontFamily="JetBrains Mono">{lt}d</text>
              </g>);
            })}
          </svg>
        </div></div>
        <div className="card"><div className="card-head"><h3>Capacity utilisation</h3></div><div className="card-body">
          {plantsToCompare.map((p,i)=>{
            const u = [82,68,91,55][i];

    if (legacyPlant !== data.salesEntry.plant) {
      setData(d => ({ ...d, salesEntry: { ...d.salesEntry, plant: legacyPlant } }));

  useEffect(() => {

          <div className="nw-brand-text">
            <div className="t1">Neterwala Group</div>
            <div className="t2">Product Estimation Platform</div>
          </div>
        </div>

        <span className="nw-platform-pill">wireframe · v0.2</span>

        <span className="topbar-spacer" />

        <div className="nw-context" title="Switch company">
          <span className="dot" style={{background:activeCompany.color}}/>
          <span>
            <span className="lbl">Company</span><br/>
            <span className="val">{activeCompany.code}</span>
          </span>
          <span style={{fontFamily:'var(--font-mono)',color:'var(--ink-faint)'}}>▾</span>
        </div>

        <div className="nw-context" title="Switch plant">
          <span>
            <span className="lbl">Plant</span><br/>
            <span className="val">{t.plant}</span>
          </span>
          <span style={{fontFamily:'var(--font-mono)',color:'var(--ink-faint)'}}>▾</span>
        </div>

        <div className="nw-context" title="Process">
          <span>
            <span className="lbl">Process</span><br/>
            <span className="val" style={{fontSize:14}}>{activeCompany.process}</span>
          </span>
        </div>

        <div className="user-chip">
          <span className="av">{t.role[0]}</span>
          <span style={{fontSize:13}}>{t.role}<br/><span style={{fontSize:10,fontFamily:'var(--font-mono)',color:'var(--ink-soft)'}}>Tech User</span></span>
        </div>
      </header>

      <aside className="sidebar">
        {NavRender()}
        <div className="nw-foot">
          <b style={{fontFamily:'var(--font-hand-bold)',fontSize:14}}>Group platform · wireframe</b><br/>
          Low-fi sketch. Common engine across<br/>
          UDL · UTPL · UAL · UAML · TGUK.
        </div>
      </aside>

      <main className="main">
        <div className="nw-context-strip">
          <span className="dot" style={{display:'inline-block',width:10,height:10,borderRadius:'50%',border:'1.5px solid var(--ink)',background:activeCompany.color}}/>
          <span>Acting as <b>{t.role}</b></span>
          <span style={{color:'var(--ink-faint)'}}>·</span>
          <span>Company: <b>{activeCompany.name}</b></span>
          <span style={{color:'var(--ink-faint)'}}>·</span>
          <span>Plant: <b>{t.plant}</b> ({activePlant.ccy})</span>
          <span style={{color:'var(--ink-faint)'}}>·</span>
          <span>Process: <b>{activeCompany.process}</b></span>
          <span style={{flex:1}}/>
          <span className="sketch-note" style={{margin:0,fontFamily:'var(--font-hand)',fontSize:13}}>
            ⚠ Plant selection is <b>mandatory</b> — same product, different cost per plant.
          </span>
        </div>

        {page==='dashboard' && (<>
          <h1 className="page-title">Group Dashboard <span className="scribble">5 companies · live</span></h1>
          <p className="page-sub">Multi-company estimation pipeline. Drill into any tile.</p>
          <window.NW_GroupDashboard />
        </>)}

        {page==='workflow' && (<>
          <h1 className="page-title">RFQ Workflow <span className="scribble">Intake → Estimate → Validate → Approve → Quote</span></h1>
          <p className="page-sub">Stage-gated workflow across companies. SLA breaches in red.</p>
          <window.NW_Workflow />
        </>)}

        {page==='estimations' && (<>
          <h1 className="page-title">Estimations <span className="scribble">all quotations · group-wide</span></h1>
          <p className="page-sub">Full history with filters. Open any to view, clone, or compare.</p>
          <window.HistoryPage onOpen={()=>setPage('estimation')} />
        </>)}

        {page==='salesentry' && (<>
          <h1 className="page-title">Sales Entry <span className="scribble">7-step wizard · 70+ fields</span></h1>
          <p className="page-sub">Captures everything from <em>Sales Entry</em> sheet — Part ID, Composition, Mech props, HT, Mould, Pricing, Tooling.</p>
          <window.SalesEntryWizard data={data} setData={setData} onSubmit={()=>setPage('estimation')} />
        </>)}

        {page==='estimation' && (<>
          <h1 className="page-title">Estimation Sheet <span className="scribble">{data.salesEntry.itemCode} · {t.plant} · {activeCompany.code}</span></h1>
          <p className="page-sub">All 9 calculation blocks. Plant-driven rates cascade automatically. Cell colors: <span className="tag green">green=linked</span> <span className="tag blue">blue=formula</span> <span className="tag yellow">yellow=editable</span>.</p>
          <window.EstimationSheet data={data} setData={setData} />
        </>)}

        {page==='plantcmp' && (<>
          <h1 className="page-title">Plant Comparison <span className="scribble">same product · multi-plant</span></h1>
          <p className="page-sub">The platform's hero capability. Same item, different costs across plants — pick the most viable.</p>
          <window.NW_PlantComparison />
        </>)}

        {page==='scenarios' && (<>
          <h1 className="page-title">Scenarios & Versions <span className="scribble">what-if · RFQ → Final</span></h1>
          <p className="page-sub">Simulate price / yield / plant moves. Save each as an immutable version.</p>
          <window.NW_Scenarios />
        </>)}

        {page==='analytics' && (<>
          <h1 className="page-title">Analytics <span className="scribble">group-level</span></h1>
          <p className="page-sub">Cost breakdown, material vs labour, plant index, cost drivers.</p>
          <window.NW_Analytics />
        </>)}

        {page==='master' && (<>
          <h1 className="page-title">Master Data <span className="scribble">admin only · audit-logged</span></h1>
          <p className="page-sub">All rates that drive cost cascades. Per-plant rate masters with role-bound ownership.</p>
          <window.MasterDataPage />
        </>)}

        {page==='sap' && (<>
          <h1 className="page-title">SAP Integration <span className="scribble">S/4HANA · live</span></h1>
          <p className="page-sub">Inputs: Material Master, BOM, Routing, Work Center Rates. Outputs: Cost Estimate (CK11N equiv.), Price Reference.</p>
          <window.NW_Sap />
        </>)}

        {page==='governance' && (<>
          <h1 className="page-title">Governance <span className="scribble">roles · approvals · audit</span></h1>
          <p className="page-sub">Sales create · Engineering validate · Finance approve · Plant owns rates · PMO governs.</p>
          <window.NW_Governance />
        </>)}

        {page==='config' && (<>
          <h1 className="page-title">Configuration <span className="scribble">no-code · effective dated</span></h1>
          <p className="page-sub">Add plants, processes, costing logic, rate masters — without redeploy.</p>
          <window.NW_Configuration />
        </>)}

        {page==='arch' && (<>
          <h1 className="page-title">Architecture <span className="scribble">frontend · backend · SAP</span></h1>
          <p className="page-sub">Three-tier blueprint. Future hooks for MES, Databricks, Agentic RFQ.</p>
          <window.NW_Architecture />
        </>)}

        {page==='datamodel' && (<>
          <h1 className="page-title">Data Model <span className="scribble">core entities</span></h1>
          <p className="page-sub">Company → Plant. Product → BOM → Routing. Estimation → Version. Rates per plant.</p>
          <window.NW_DataModel />
        </>)}

        {page==='export' && (<>
          <h1 className="page-title">Export <span className="scribble">PDF or Excel · branded</span></h1>
          <p className="page-sub">Generate customer-facing documents with Neterwala header on the current version.</p>
          <window.ExportPage />
        </>)}
      </main>

      {window.TweaksPanel && (
        <window.TweaksPanel title="Tweaks">
          <window.TweakSection label="Context">
            <window.TweakSelect
              label="Company"
              value={t.company}
              options={N.companies.map(c=>({value:c.code,label:`${c.code} · ${c.name.split(' ').slice(0,2).join(' ')}`}))}
              onChange={v=>t.setTweak('company',v)}
            />
            <window.TweakSelect
              label="Plant"
              value={t.plant}
              options={activeCompany.plants.map(p=>({value:p,label:`${p} (${N.plants[p].ccy})`}))}
              onChange={v=>t.setTweak('plant',v)}
            />
            <window.TweakRadio
              label="Acting role"
              value={t.role}
              options={['Sales','Engineering','Finance','Plant','PMO']}
              onChange={v=>t.setTweak('role',v)}
            />
          </window.TweakSection>

          <window.TweakSection label="Estimation">
            <window.TweakSelect
              label="Rejection scenario"
              value={String(t.scenario)}
              options={[{value:'0',label:'A · 15%'},{value:'1',label:'B · 20%'},{value:'2',label:'C · 25%'}]}
              onChange={v=>t.setTweak('scenario',+v)}
            />
            <window.TweakToggle
              label="Show formula layer"
              value={t.showFormulaLayer}
              onChange={v=>t.setTweak('showFormulaLayer',v)}
            />
          </window.TweakSection>

          <window.TweakSection label="Wireframe">
            <window.TweakRadio
              label="Density"
              value={t.density}
              options={['compact','normal','airy']}
              onChange={v=>t.setTweak('density',v)}
            />
          </window.TweakSection>
        </window.TweaksPanel>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<NWApp />);

</script>

</body>
</html>
