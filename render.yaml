services:
  - type: web
    name: neterwala-estimation-platform
    env: node
    buildCommand: cd server && npm install && cd ../client && npm install && npm run build
    startCommand: cd server && NODE_ENV=production npx tsx src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: neterwala-db
          property: connectionString
      - key: PORT
        value: 3001

databases:
  - name: neterwala-db
    databaseName: neterwala_platform
    user: neterwala
